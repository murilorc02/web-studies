<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/d6f354eb2b.js" crossorigin="anonymous"></script>
</head>

<body>
    <section id="clock-container" class="container">
        <span id="timer">00:00:00</span>
        <div class="button-group">
            <button class="timer-controls" id="start">
                <i class="fa-solid fa-play"></i>
            </button>
            <button class="timer-controls" id="pause">
                <i class="fa-solid fa-pause"></i>
            </button>
            <button class="timer-controls" id="reset">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </div>
    </section>
    <script src="stopwatch.js"></script>
</body>

</html>
