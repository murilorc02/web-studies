<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Function Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section class="container">
        <h1>Calculator</h1>
        <hr>
        <table class="calculator">
            <tr>
                <td colspan="4">
                    <input type="text" disabled class="display" placeholder="0" />
                </td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-clear">C</button></td>
                <td colspan="2" class="calc-btn"><button class="btn btn-del">←</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-digit">/</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">7</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">8</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">9</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-digit">*</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">4</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">5</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">6</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-digit">+</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">1</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">2</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num btn-digit">3</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-digit">-</button></td>
            </tr>
            <tr>
                <td colspan="2" class="calc-btn"><button class="btn btn-num btn-digit">0</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-digit">.</button></td>
                <td colspan="2" class="calc-btn"><button class="btn btn-result">=</button></td>
            </tr>
        </table>
        <hr>
    </section>
    <script src="factoryFunction.js"></script>
</body>

</html>
