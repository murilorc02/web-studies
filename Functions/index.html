<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section class="container">
        <h1>Calculator</h1>
        <hr>
        <table class="calculator">
            <tr>
                <td colspan="4">
                    <input type="text" disabled class="display" value="0" />
                </td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-action">C</button></td>
                <td colspan="1" class="calc-btn"><button class="btn">(</button></td>
                <td colspan="1" class="calc-btn"><button class="btn">)</button></td>
                <td colspan="1" class="calc-btn"><button class="btn">/</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">7</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">8</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">9</button></td>
                <td colspan="1" class="calc-btn"><button class="btn">*</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">4</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">5</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">6</button></td>
                <td colspan="1" class="calc-btn"><button class="btn">+</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">1</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">2</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">3</button></td>
                <td colspan="1" class="calc-btn"><button class="btn">-</button></td>
            </tr>
            <tr>
                <td colspan="1" class="calc-btn"><button class="btn">.</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-num">0</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-action">←</button></td>
                <td colspan="1" class="calc-btn"><button class="btn btn-result">=</button></td>
            </tr>
        </table>
        <hr>
    </section>
</body>

</html>
